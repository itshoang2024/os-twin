# SearXNG settings for ostwin
# see https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

server:
  secret_key: "ostwin-dev-searxng-key"
  bind_address: "0.0.0.0"
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json
