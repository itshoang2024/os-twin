# ──────────────────────────────────────────────────────────────────────────────
# Agent OS — Cross-Platform CI/CD
#
# Validates the modularized bash installer (EPIC-001), Windows installer
# (EPIC-002), and the full Pester test suite on all three platforms.
#
# Matrix: ubuntu-latest, macos-latest, windows-latest
# Trigger: any push/PR touching .agents/ or this workflow
#
# EPIC-005 — Cross-Platform CI/CD and Test Harness
# ──────────────────────────────────────────────────────────────────────────────

name: Agent OS — CI

on:
  push:
    branches: [main, release-*, hotfix/*, feature/*, fix/*]
  pull_request:
    branches: [main, release-*]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: BATS tests for bash installer modules (macOS + Linux only)
# Runs the 16 BATS test files created by EPIC-001.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  bats-installer-tests:
    name: "BATS Installer Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BATS
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core
          fi
          bats --version

      - name: Run BATS installer tests
        shell: bash
        run: |
          mkdir -p test-results
          bats \
            --formatter junit \
            .agents/installer/tests/test_*.bats \
            > test-results/bats-installer-results.xml 2>&1 || {
              EXIT_CODE=$?
              echo "::error::BATS tests failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            }

      - name: Upload BATS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-installer-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish BATS test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "BATS Installer Tests — ${{ matrix.os }}"
          path: test-results/bats-installer-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Pester installer tests (all 3 platforms)
  # Runs the 15 Pester test files for .agents/installer/*.ps1 (EPIC-002).
  # Windows-only tests are auto-skipped on macOS/Linux.
  # ─────────────────────────────────────────────────────────────────────────
  pester-installer-tests:
    name: "Pester Installer Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available
        shell: bash
        run: pwsh --version

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser

      - name: Run Pester installer tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = '.agents/installer/tests/windows/'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester-installer-results.xml'
          New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
          Invoke-Pester -Configuration $config

      - name: Upload Pester installer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-installer-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish Pester installer test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Pester Installer Tests — ${{ matrix.os }}"
          path: test-results/pester-installer-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Agent PowerShell unit tests (all 3 platforms)
  # Runs all tracked .agents Pester unit tests outside installer-specific tests.
  # ─────────────────────────────────────────────────────────────────────────
  pester-core-tests:
    name: "Agent PowerShell Unit Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available
        shell: bash
        run: pwsh --version

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser

      - name: Install lightweight test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run .agents PowerShell unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.agents/tests/',
            '.agents/bin/tests/'
          )
          $config.Filter.ExcludeTag = @('Integration', 'Slow')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester-agents-results.xml'
          New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
          Invoke-Pester -Configuration $config

      - name: Upload Pester core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-core-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish Pester core test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Pester Core Tests — ${{ matrix.os }}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4a: Dashboard Python unit tests (Linux only)
  # Runs dashboard pytest tests with slow/manual external-service coverage excluded.
  # ─────────────────────────────────────────────────────────────────────────
  dashboard-python-tests:
    name: "Dashboard Python Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: dashboard/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dashboard Python dependencies
        working-directory: dashboard
        run: |
          uv sync --extra dev --frozen

      - name: Run dashboard Python unit tests
        working-directory: dashboard
        env:
          OSTWIN_DEV_MODE: '1'
          OSTWIN_API_KEY: test-key
          OSTWIN_AUTH_KEY: test-key
          OSTWIN_RUN_SUBPROCESS_MCP_TEST: '0'
          RUN_HUGGINGFACE_INTEGRATION: '0'
        run: |
          mkdir -p ../test-results
          uv run pytest -q -m "not slow" \
            --ignore=tests/manual_gate_test.py \
            --ignore=tests/manual_mcp_test.py \
            --ignore-glob='tests/*integration*.py' \
            --ignore-glob='tests/**/*integration*.py' \
            --ignore-glob='tests/*e2e*.py' \
            --ignore-glob='tests/**/*e2e*.py' \
            --ignore-glob='tests/*functional*.py' \
            --ignore-glob='tests/**/*functional*.py' \
            --ignore-glob='tests/*stress*.py' \
            --ignore-glob='tests/**/*stress*.py' \
            --junitxml=../test-results/dashboard-python-results.xml

      - name: Upload dashboard Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-python-test-results
          path: test-results/dashboard-python-results.xml
          retention-days: 30

      - name: Publish dashboard Python test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Dashboard Python Unit Tests
          path: test-results/dashboard-python-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4b: Dashboard frontend unit tests (Linux only)
  # Runs Vitest for dashboard/fe.
  # ─────────────────────────────────────────────────────────────────────────
  dashboard-frontend-tests:
    name: "Dashboard Frontend Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: dashboard/fe
        run: bun install --frozen-lockfile

      - name: Run dashboard frontend unit tests
        working-directory: dashboard/fe
        run: |
          mkdir -p ../test-results
          bunx vitest run --reporter=default --reporter=junit --outputFile=../test-results/dashboard-fe-vitest-results.xml

      - name: Upload dashboard frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-frontend-test-results
          path: dashboard/test-results/dashboard-fe-vitest-results.xml
          retention-days: 30

      - name: Publish dashboard frontend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Dashboard Frontend Unit Tests
          path: dashboard/test-results/dashboard-fe-vitest-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4c: Bot tests (Linux only)
  # Validates the Discord/Telegram bot — agent-bridge, commands, sessions,
  # connectors, and asset staging.
  # ─────────────────────────────────────────────────────────────────────────
  bot-tests:
    name: "Bot Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install bot dependencies
        shell: bash
        working-directory: bot
        run: bun install --frozen-lockfile

      - name: TypeScript compile check
        shell: bash
        working-directory: bot
        run: bunx tsc --noEmit

      - name: Run bot tests
        shell: bash
        working-directory: bot
        run: bun --bun run test

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Smoke test — install.sh (Linux only)
  # Validates the bash installer completes without error in CI.
  # Uses --yes --skip-optional to avoid interactive prompts and heavy deps.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test-bash:
    name: "Smoke Test — install.sh (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make installer executable
        run: chmod +x .agents/install.sh

      - name: Run install.sh --yes --skip-optional (smoke test)
        shell: bash
        run: |
          SOURCE_DIR="$(pwd)"
          export SOURCE_DIR
          .agents/install.sh --yes --skip-optional 2>&1 | tee install-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::install.sh exited with code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "::notice::install.sh completed successfully"

      - name: Dashboard health check (post-install)
        shell: bash
        run: |
          VENV_PYTHON="$HOME/.ostwin/.venv/bin/python"
          if [[ -f "$VENV_PYTHON" ]]; then
            REPO_DIR="$(pwd)" "$VENV_PYTHON" -c "
          import sys, os
          repo = os.environ.get('REPO_DIR', '.')
          sys.path.insert(0, repo)
          sys.path.insert(0, os.path.join(repo, 'dashboard'))
          from dashboard.api import app
          print('Dashboard API app created. Routes: %d' % len(app.routes))
          assert len(app.routes) > 0, 'No routes registered'
          print('Health check: PASS')
          "
          else
            echo "::warning::Venv not found at $VENV_PYTHON — running fallback syntax check"
            python3 -c 'import ast; ast.parse(open("dashboard/api.py").read()); print("dashboard/api.py parses OK")'
          fi

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-bash-log
          path: install-output.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Smoke test — install.ps1 (Windows only)
  # Validates the PowerShell installer completes without error in CI.
  # Uses -Yes -SkipOptional for non-interactive mode.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test-powershell:
    name: "Smoke Test — install.ps1 (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run install.ps1 -Yes -SkipOptional (smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SOURCE_DIR = $PWD.Path
          try {
            & .\.agents\install.ps1 -Yes -SkipOptional -SourceDir $PWD.Path 2>&1 |
              Tee-Object -FilePath install-output.log
            Write-Host "::notice::install.ps1 completed successfully"
          }
          catch {
            Write-Host "::error::install.ps1 failed: $_"
            exit 1
          }

      - name: Dashboard health check (post-install, Windows)
        shell: pwsh
        run: |
          $venvPython = Join-Path $HOME ".ostwin\.venv\Scripts\python.exe"
          if (Test-Path $venvPython) {
            $env:REPO_DIR = $PWD.Path
            & $venvPython -c "import sys, os; repo = os.environ.get('REPO_DIR', '.'); sys.path.insert(0, repo); sys.path.insert(0, os.path.join(repo, 'dashboard')); from dashboard.api import app; print('Dashboard API: %d routes' % len(app.routes)); assert len(app.routes) > 0; print('Health check: PASS')"
          }
          else {
            Write-Host "::warning::Venv not found — running fallback syntax check"
            python -c "import ast; ast.parse(open('dashboard/api.py').read()); print('dashboard/api.py parses OK')"
          }

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-powershell-log
          path: install-output.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: CI gate — all jobs must pass for merge
  # This is a synthetic "required check" job that depends on all other jobs.
  # Configure branch protection to require "CI Gate — All Checks" to pass.
  # ─────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate — All Checks"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bats-installer-tests
      - pester-installer-tests
      - pester-core-tests
      - dashboard-python-tests
      - dashboard-frontend-tests
      - bot-tests
      - smoke-test-bash
      - smoke-test-powershell

    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  bats-installer-tests:    ${{ needs.bats-installer-tests.result }}"
          echo "  pester-installer-tests:  ${{ needs.pester-installer-tests.result }}"
          echo "  pester-core-tests:       ${{ needs.pester-core-tests.result }}"
          echo "  dashboard-python-tests:  ${{ needs.dashboard-python-tests.result }}"
          echo "  dashboard-frontend-tests: ${{ needs.dashboard-frontend-tests.result }}"
          echo "  bot-tests:               ${{ needs.bot-tests.result }}"
          echo "  smoke-test-bash:         ${{ needs.smoke-test-bash.result }}"
          echo "  smoke-test-powershell:   ${{ needs.smoke-test-powershell.result }}"
          FAILED=false
          for result in \
            "${{ needs.bats-installer-tests.result }}" \
            "${{ needs.pester-installer-tests.result }}" \
            "${{ needs.pester-core-tests.result }}" \
            "${{ needs.dashboard-python-tests.result }}" \
            "${{ needs.dashboard-frontend-tests.result }}" \
            "${{ needs.bot-tests.result }}" \
            "${{ needs.smoke-test-bash.result }}" \
            "${{ needs.smoke-test-powershell.result }}"; do
            if [[ "$result" != "success" ]]; then
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::One or more CI jobs failed — merge blocked"
            exit 1
          fi
          echo "::notice::All CI checks passed — merge allowed"
