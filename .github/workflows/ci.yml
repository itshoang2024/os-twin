# ──────────────────────────────────────────────────────────────────────────────
# Agent OS — Cross-Platform CI/CD
#
# Validates the modularized bash installer (EPIC-001), Windows installer
# (EPIC-002), and the full Pester test suite on all three platforms.
#
# Matrix: ubuntu-latest, macos-latest, windows-latest
# Trigger: any push/PR touching .agents/ or this workflow
#
# EPIC-005 — Cross-Platform CI/CD and Test Harness
# ──────────────────────────────────────────────────────────────────────────────

name: Agent OS — CI

on:
  push:
    branches: [main, release-*, hotfix/*, feature/*, fix/*]
  pull_request:
    branches: [main, release-*]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: BATS tests for bash installer modules (macOS + Linux only)
# Runs the 16 BATS test files created by EPIC-001.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  bats-installer-tests:
    name: "BATS Installer Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BATS
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bats
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core
          fi
          bats --version

      - name: Run BATS installer tests
        shell: bash
        run: |
          mkdir -p test-results
          bats \
            --formatter junit \
            .agents/installer/tests/test_*.bats \
            > test-results/bats-installer-results.xml 2>&1 || {
              EXIT_CODE=$?
              echo "::error::BATS tests failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            }

      - name: Upload BATS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-installer-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish BATS test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "BATS Installer Tests — ${{ matrix.os }}"
          path: test-results/bats-installer-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Pester installer tests (all 3 platforms)
  # Runs the 15 Pester test files for .agents/installer/*.ps1 (EPIC-002).
  # Windows-only tests are auto-skipped on macOS/Linux.
  # ─────────────────────────────────────────────────────────────────────────
  pester-installer-tests:
    name: "Pester Installer Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available
        shell: bash
        run: pwsh --version

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser

      - name: Run Pester installer tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = '.agents/installer/tests/windows/'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester-installer-results.xml'
          New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
          Invoke-Pester -Configuration $config

      - name: Upload Pester installer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-installer-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish Pester installer test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Pester Installer Tests — ${{ matrix.os }}"
          path: test-results/pester-installer-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Agent PowerShell unit tests (all 3 platforms)
  # Runs all tracked .agents Pester unit tests outside installer-specific tests.
  # ─────────────────────────────────────────────────────────────────────────
  pester-core-tests:
    name: "Agent PowerShell Unit Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure PowerShell is available
        shell: bash
        run: pwsh --version

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser

      - name: Install lightweight test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run .agents PowerShell unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.agents/tests/',
            '.agents/bin/tests/'
          )
          $config.Filter.ExcludeTag = @('Integration', 'Slow')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester-agents-results.xml'
          New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
          Invoke-Pester -Configuration $config

      - name: Upload Pester core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-core-results-${{ matrix.os }}
          path: test-results/
          retention-days: 30

      - name: Publish Pester core test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Pester Core Tests — ${{ matrix.os }}"
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4a: Dashboard Python unit tests (Linux only)
  # Runs dashboard pytest tests with slow/manual external-service coverage excluded.
  # ─────────────────────────────────────────────────────────────────────────
  dashboard-python-tests:
    name: "Dashboard Python Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: dashboard/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dashboard Python dependencies
        working-directory: dashboard
        run: |
          uv sync --extra dev --frozen

      - name: Run dashboard Python unit tests
        working-directory: dashboard
        env:
          OSTWIN_DEV_MODE: '1'
          OSTWIN_API_KEY: test-key
          OSTWIN_AUTH_KEY: test-key
          OSTWIN_RUN_SUBPROCESS_MCP_TEST: '0'
          RUN_HUGGINGFACE_INTEGRATION: '0'
        run: |
          mkdir -p ../test-results
          uv run pytest -q -m "not slow" \
            --ignore=tests/manual_gate_test.py \
            --ignore=tests/manual_mcp_test.py \
            --ignore-glob='tests/*integration*.py' \
            --ignore-glob='tests/**/*integration*.py' \
            --ignore-glob='tests/*e2e*.py' \
            --ignore-glob='tests/**/*e2e*.py' \
            --ignore-glob='tests/*functional*.py' \
            --ignore-glob='tests/**/*functional*.py' \
            --ignore-glob='tests/*stress*.py' \
            --ignore-glob='tests/**/*stress*.py' \
            --junitxml=../test-results/dashboard-python-results.xml

      - name: Upload dashboard Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-python-test-results
          path: test-results/dashboard-python-results.xml
          retention-days: 30

      - name: Publish dashboard Python test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Dashboard Python Unit Tests
          path: test-results/dashboard-python-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4b: Dashboard frontend unit tests (Linux only)
  # Runs Vitest for dashboard/fe.
  # ─────────────────────────────────────────────────────────────────────────
  dashboard-frontend-tests:
    name: "Dashboard Frontend Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: dashboard/fe
        run: bun install --frozen-lockfile

      - name: Run dashboard frontend unit tests
        working-directory: dashboard/fe
        run: |
          mkdir -p ../test-results
          bunx vitest run --reporter=default --reporter=junit --outputFile=../test-results/dashboard-fe-vitest-results.xml

      - name: Upload dashboard frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-frontend-test-results
          path: dashboard/test-results/dashboard-fe-vitest-results.xml
          retention-days: 30

      - name: Publish dashboard frontend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Dashboard Frontend Unit Tests
          path: dashboard/test-results/dashboard-fe-vitest-results.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4c: Bot tests (Linux only)
  # Validates the Discord/Telegram bot — agent-bridge, commands, sessions,
  # connectors, and asset staging.
  # ─────────────────────────────────────────────────────────────────────────
  bot-tests:
    name: "Bot Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install bot dependencies
        shell: bash
        working-directory: bot
        run: bun install --frozen-lockfile

      - name: TypeScript compile check
        shell: bash
        working-directory: bot
        run: bunx tsc --noEmit

      - name: Run bot tests
        shell: bash
        working-directory: bot
        run: bun --bun run test

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Smoke test — install.sh (Linux only)
  # Validates the bash installer completes without error in CI.
  # Uses --yes --skip-optional to avoid interactive prompts and heavy deps.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test-bash:
    name: "Smoke Test — install.sh (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install smoke test system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync

      - name: Make installer executable
        run: chmod +x .agents/install.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run install.sh --yes --skip-optional --no-ollama (smoke test)
        shell: bash
        run: |
          SOURCE_DIR="$(pwd)"
          export SOURCE_DIR
          .agents/install.sh --yes --skip-optional --no-ollama 2>&1 | tee install-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::install.sh exited with code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "::notice::install.sh completed successfully"

      - name: Dashboard health check (post-install)
        shell: bash
        run: |
          VENV_PYTHON="$HOME/.ostwin/.venv/bin/python"
          if [[ -f "$VENV_PYTHON" ]]; then
            REPO_DIR="$(pwd)" "$VENV_PYTHON" -c "
          import sys, os
          repo = os.environ.get('REPO_DIR', '.')
          sys.path.insert(0, repo)
          sys.path.insert(0, os.path.join(repo, 'dashboard'))
          from dashboard.api import app
          print('Dashboard API app created. Routes: %d' % len(app.routes))
          assert len(app.routes) > 0, 'No routes registered'
          print('Health check: PASS')
          "
          else
            echo "::warning::Venv not found at $VENV_PYTHON — running fallback syntax check"
            python3 -c 'import ast; ast.parse(open("dashboard/api.py").read()); print("dashboard/api.py parses OK")'
          fi

      - name: Run minimal Ostwin plan (smoke test)
        shell: bash
        working-directory: .github/smoke-test-folder
        run: |
          set -euo pipefail
          rm -rf .war-rooms .agents .opencode
          rm -f index.html .planning-DAG.json ostwin-run-output.log
          export OSTWIN_WORKSPACE_ISOLATION=shared
          export OSTWIN_SKIP_PLAN_REVIEW=true
          OSTWIN="$HOME/.ostwin/.agents/bin/ostwin"

          plan_output="$($OSTWIN plan create that.plan.md 2>&1)"
          printf '%s\n' "$plan_output"
          plan_id="$(printf '%s\n' "$plan_output" | grep -Eo 'Plan created: [0-9a-fA-F]+' | grep -Eo '[0-9a-fA-F]+' | tail -1 || true)"
          if [[ -z "$plan_id" ]]; then
            echo "::error::Could not parse plan ID from ostwin plan create output"
            exit 1
          fi

          roles_file="$HOME/.ostwin/.agents/plans/${plan_id}.roles.json"
          if [[ ! -f "$roles_file" ]]; then
            echo "::error::Plan roles file not found: $roles_file"
            exit 1
          fi
          echo "Plan: $roles_file"
          grep -nE '"(default_model|model)"' "$roles_file"
          python3 - "$roles_file" <<'PY'
          import json
          import sys

          roles_file = sys.argv[1]

          def replace_default_model(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {"default_model", "model"}:
                          value[key] = "opencode/big-pickle"
                      else:
                          replace_default_model(child)
              elif isinstance(value, list):
                  for child in value:
                      replace_default_model(child)

          with open(roles_file, encoding="utf-8") as handle:
              data = json.load(handle)
          replace_default_model(data)
          with open(roles_file, "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PY
          grep -nE '"(default_model|model)"' "$roles_file"
          if grep -nE '"(default_model|model)"' "$roles_file" | grep -vE '"(default_model|model)": "opencode/big-pickle"'; then
            echo "::error::Not all plan role model/default_model values were rewritten to opencode/big-pickle"
            exit 1
          fi

          if ! timeout 180s "$OSTWIN" run "$plan_id" 2>&1 | tee ostwin-run-output.log; then
            echo "::error::ostwin run failed"
            exit 1
          fi
          if grep -q 'Model=openai/gpt-5.5' ostwin-run-output.log; then
            echo "::error::Smoke flow still launched an agent with Model=openai/gpt-5.5"
            exit 1
          fi
          cat > .gitignore <<'EOF'
          # Ostwin generated runtime artifacts
          .agents/
          .memory
          .opencode/
          .planning-DAG.json
          .war-rooms/
          index.html
          ostwin-run-output.log
          EOF
          cat index.html
          grep -q "Hello this is OsTwin" index.html
          echo "::notice::Minimal Ostwin plan created, ran, QA passed, and generated index.html"

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-bash-log
          path: install-output.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Smoke test — install.ps1 (Windows only)
  # Validates the PowerShell installer completes without error in CI.
  # Uses -Yes -SkipOptional for non-interactive mode.
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test-powershell:
    name: "Smoke Test — install.ps1 (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run install.ps1 -Yes -SkipOptional (smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SOURCE_DIR = $PWD.Path
          try {
            & .\.agents\install.ps1 -Yes -SkipOptional -SourceDir $PWD.Path 2>&1 |
              Tee-Object -FilePath install-output.log
            Write-Host "::notice::install.ps1 completed successfully"
          }
          catch {
            Write-Host "::error::install.ps1 failed: $_"
            exit 1
          }

      - name: Dashboard health check (post-install, Windows)
        shell: pwsh
        run: |
          $venvPython = Join-Path $HOME ".ostwin\.venv\Scripts\python.exe"
          if (Test-Path $venvPython) {
            $env:REPO_DIR = $PWD.Path
            & $venvPython -c "import sys, os; repo = os.environ.get('REPO_DIR', '.'); sys.path.insert(0, repo); sys.path.insert(0, os.path.join(repo, 'dashboard')); from dashboard.api import app; print('Dashboard API: %d routes' % len(app.routes)); assert len(app.routes) > 0; print('Health check: PASS')"
          }
          else {
            Write-Host "::warning::Venv not found — running fallback syntax check"
            python -c "import ast; ast.parse(open('dashboard/api.py').read()); print('dashboard/api.py parses OK')"
          }

      - name: Run minimal Ostwin plan (smoke test, Windows)
        shell: pwsh
        working-directory: .github/smoke-test-folder
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item -Recurse -Force .war-rooms, .agents, .opencode -ErrorAction SilentlyContinue
          Remove-Item -Force index.html, .planning-DAG.json, ostwin-run-output.log -ErrorAction SilentlyContinue
          $env:OSTWIN_WORKSPACE_ISOLATION = 'shared'
          $env:OSTWIN_SKIP_PLAN_REVIEW = 'true'

          $ostwin = Join-Path $HOME '.ostwin\.agents\bin\ostwin'
          if (-not (Test-Path $ostwin)) {
            Write-Host "::error::ostwin CLI not found: $ostwin"
            exit 1
          }

          $dashboardUrl = 'http://127.0.0.1:3366/api/status'
          $dashboardReady = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Invoke-RestMethod -Uri $dashboardUrl -TimeoutSec 2 | Out-Null
              $dashboardReady = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $dashboardReady) {
            $dashboard = Join-Path $HOME '.ostwin\.agents\dashboard.ps1'
            if (-not (Test-Path $dashboard)) {
              Write-Host "::error::dashboard.ps1 not found: $dashboard"
              exit 1
            }
            & pwsh -NoProfile -File $dashboard -Background -Port 3366 -ProjectDir (Get-Location).Path
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-RestMethod -Uri $dashboardUrl -TimeoutSec 2 | Out-Null
                $dashboardReady = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
          }

          if (-not $dashboardReady) {
            Write-Host '::error::Dashboard did not become ready for plan creation'
            exit 1
          }

          $planOutput = & pwsh -NoProfile -File $ostwin plan create that.plan.md 2>&1 | Out-String
          Write-Host $planOutput
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ostwin plan create failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          $planMatch = [regex]::Match($planOutput, 'Plan created:\s*([0-9a-fA-F]+)')
          if (-not $planMatch.Success) {
            Write-Host '::error::Could not parse plan ID from ostwin plan create output'
            exit 1
          }
          $planId = $planMatch.Groups[1].Value

          $rolesFile = Join-Path $HOME ".ostwin\.agents\plans\$planId.roles.json"
          if (-not (Test-Path $rolesFile)) {
            Write-Host "::error::Plan roles file not found: $rolesFile"
            exit 1
          }
          Write-Host "Plan: $rolesFile"
          Select-String -Path $rolesFile -Pattern '"(default_model|model)"' | ForEach-Object { $_.Line }

          function Set-SmokeModel {
            param([object]$Value)
            if ($null -eq $Value) { return }
            if ($Value -is [System.Collections.IDictionary]) {
              foreach ($key in @($Value.Keys)) {
                if ($key -in @('default_model', 'model')) {
                  $Value[$key] = 'opencode/big-pickle'
                } else {
                  Set-SmokeModel $Value[$key]
                }
              }
              return
            }
            if ($Value -is [System.Collections.IEnumerable] -and $Value -isnot [string]) {
              foreach ($item in $Value) { Set-SmokeModel $item }
              return
            }
            if ($Value.PSObject -and $Value.PSObject.Properties) {
              foreach ($prop in $Value.PSObject.Properties) {
                if ($prop.Name -in @('default_model', 'model')) {
                  $prop.Value = 'opencode/big-pickle'
                } else {
                  Set-SmokeModel $prop.Value
                }
              }
            }
          }

          $roles = Get-Content $rolesFile -Raw | ConvertFrom-Json
          Set-SmokeModel $roles
          $roles | ConvertTo-Json -Depth 100 | Set-Content -Path $rolesFile -Encoding utf8
          $modelLines = Select-String -Path $rolesFile -Pattern '"(default_model|model)"'
          $modelLines | ForEach-Object { $_.Line }
          $badModelLines = $modelLines | Where-Object { $_.Line -notmatch '"(default_model|model)":\s*"opencode/big-pickle"' }
          if ($badModelLines) {
            $badModelLines | ForEach-Object { Write-Host $_.Line }
            Write-Host '::error::Not all plan role model/default_model values were rewritten to opencode/big-pickle'
            exit 1
          }

          & pwsh -NoProfile -File $ostwin run $planId 2>&1 | Tee-Object -FilePath ostwin-run-output.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ostwin run failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (Select-String -Path ostwin-run-output.log -Pattern 'Model=openai/gpt-5.5' -Quiet) {
            Write-Host '::error::Smoke flow still launched an agent with Model=openai/gpt-5.5'
            exit 1
          }
          @(
            '# Ostwin generated runtime artifacts',
            '.agents/',
            '.memory',
            '.opencode/',
            '.planning-DAG.json',
            '.war-rooms/',
            'index.html',
            'ostwin-run-output.log'
          ) | Set-Content -Path .gitignore -Encoding utf8
          Get-Content index.html
          if (-not (Select-String -Path index.html -Pattern 'Hello this is OsTwin' -Quiet)) {
            Write-Host '::error::index.html does not contain Hello this is OsTwin'
            exit 1
          }
          Write-Host '::notice::Minimal Ostwin plan created, ran, QA passed, and generated index.html on Windows'

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-powershell-log
          path: install-output.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: CI gate — all jobs must pass for merge
  # This is a synthetic "required check" job that depends on all other jobs.
  # Configure branch protection to require "CI Gate — All Checks" to pass.
  # ─────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate — All Checks"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bats-installer-tests
      - pester-installer-tests
      - pester-core-tests
      - dashboard-python-tests
      - dashboard-frontend-tests
      - bot-tests
      - smoke-test-bash
      - smoke-test-powershell

    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  bats-installer-tests:    ${{ needs.bats-installer-tests.result }}"
          echo "  pester-installer-tests:  ${{ needs.pester-installer-tests.result }}"
          echo "  pester-core-tests:       ${{ needs.pester-core-tests.result }}"
          echo "  dashboard-python-tests:  ${{ needs.dashboard-python-tests.result }}"
          echo "  dashboard-frontend-tests: ${{ needs.dashboard-frontend-tests.result }}"
          echo "  bot-tests:               ${{ needs.bot-tests.result }}"
          echo "  smoke-test-bash:         ${{ needs.smoke-test-bash.result }}"
          echo "  smoke-test-powershell:   ${{ needs.smoke-test-powershell.result }}"
          FAILED=false
          for result in \
            "${{ needs.bats-installer-tests.result }}" \
            "${{ needs.pester-installer-tests.result }}" \
            "${{ needs.pester-core-tests.result }}" \
            "${{ needs.dashboard-python-tests.result }}" \
            "${{ needs.dashboard-frontend-tests.result }}" \
            "${{ needs.bot-tests.result }}" \
            "${{ needs.smoke-test-bash.result }}" \
            "${{ needs.smoke-test-powershell.result }}"; do
            if [[ "$result" != "success" ]]; then
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::One or more CI jobs failed — merge blocked"
            exit 1
          fi
          echo "::notice::All CI checks passed — merge allowed"
