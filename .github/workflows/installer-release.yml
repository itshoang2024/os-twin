name: Installer Release

on:
  pull_request:
    paths:
      - installer/**
      - install.sh
      - build.sh
      - .goreleaser.yml
      - .github/workflows/installer-release.yml
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - installer/**
      - install.sh
      - build.sh
      - .goreleaser.yml
      - .github/workflows/installer-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate installer package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Verify Go module
        run: go mod verify
        working-directory: installer

      - name: Run installer tests
        run: go test ./...
        working-directory: installer

      - name: Build installer binary
        run: go build -o /tmp/ostwin-installer ./cmd/ostwin-installer
        working-directory: installer

      - name: Check bootstrap shell syntax
        run: |
          bash -n install.sh
          bash -n build.sh

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

  release:
    name: Publish installer release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Publish GoReleaser artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
