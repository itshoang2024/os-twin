name: Agent OS — Pester Tests

on:
  push:
    branches: [main, release-*, hotfix/*, feature/*, fix/*]
  pull_request:
    branches: [main, release-*]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  pester-tests:
    name: Run Pester Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        shell: bash
        run: |
          # pwsh is pre-installed on ubuntu-latest runners
          pwsh --version

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run all .agents PowerShell unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.agents/tests/',
            '.agents/bin/tests/',
            '.agents/installer/tests/windows/'
          )
          $config.Filter.ExcludeTag = @('Integration', 'Slow')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester-agents-results.xml'
          New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results/
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pester Test Report
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true
