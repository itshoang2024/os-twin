# SearXNG metasearch engine for ostwin web research
# Start: docker compose -f docker-compose.searxng.yml up -d
#
# Default endpoint: http://localhost:6633
# Set OSTWIN_SEARXNG_URL env var if using a different host/port.

services:
  searxng:
    image: "${SEARXNG_IMAGE:-searxng/searxng:latest}"
    container_name: ostwin-searxng
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-6633}:8080"
    volumes:
      - "${SEARXNG_CONFIG_DIR:-./searxng}:/etc/searxng:rw"
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-6633}/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
